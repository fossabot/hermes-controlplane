services:
  controlplane:
    build: .
    container_name: hermes-controlplane
    command: uvicorn hermes_controlplane.main:app --host ${CONTROLPLANE_HOST:-0.0.0.0} --port ${CONTROLPLANE_PORT:-8780}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${CONTROLPLANE_PORT:-8780}:${CONTROLPLANE_PORT:-8780}"
    volumes:
      - /home/matias/.hermes:/home/matias/.hermes:ro
      - ./data:/app/data
    mem_limit: 512m
    restart: unless-stopped
